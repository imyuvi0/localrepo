<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM</title>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
    }

    .subscribe-button{
      border: none;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 15px;
      padding-right: 15px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      color: white;
      background-color: black;
      margin-bottom: 30px;
    }
    .is-subscribed{
      background-color: rgb(240,240,240);
      color: black;
    }

    .cost-input{
      font-size: 15px;
      padding: 10px;
    }
    
    .calculate-button{
      background-color: green;
      color: white;
      font-size: 15px;
      padding: 12px 15px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <p>Youtube Subscribe Button</p>
  <button onclick="
    subscribe();
  " class="js-subscribe-button subscribe-button">Subscribe</button>
  <p>Amazon Shipping Calculator</p>
  <p>Order under $40 = +$10 shipping.</p>
  <p>Order over $40 = FREE shipping.</p>
  <input placeholder='Cost of order' class="js-cost-input cost-input" onkeydown="
   handlekeydown(event);
  ">
  <button onclick="
    calculateTotal();
  "
  class="calculate-button">Calculate</button>
  <p class="js-total-cost"></p>


  <script>

    function handlekeydown(event){
      if(event.key === 'Enter'){
      calculateTotal();
    }
    
    }
    function calculateTotal(){
      const inputElement = document.querySelector('.js-cost-input');
      let cost = Number(inputElement.value);

      if(cost < 40){
        cost = cost + 10;
        
      }
      document.querySelector('.js-total-cost').innerHTML = `$${cost}`; 
      
    }


    function subscribe(){
      const buttonElement = document.querySelector('.js-subscribe-button')
      if(buttonElement.innerText === 'Subscribe'){
        buttonElement.innerHTML = 'Subscribed';
        buttonElement.classList.add('is-subscribed');
      }else {
        buttonElement.classList.remove('is-subscribed');
        buttonElement.innerHTML = 'Subscribe';
        }
    }
  </script>
</body>
</html>
